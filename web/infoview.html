<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wiz infoview</title>
<style>
  :root { --bg: #fdfdfb; --fg: #1d1d1b; --dim: #777; --line: #ddd; --sel: #ffe58a; --hover: #e8eefc;
          --const: #1f4fbf; --var: #8a5a00; --sort: #00838f; --lit: #2e7d32; --data: #8e24aa; --turnstile: #8e24aa; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1b1c1e; --fg: #e4e4e0; --dim: #999; --line: #333; --sel: #5c4b00; --hover: #263248;
            --const: #8ab4ff; --var: #f0c060; --sort: #5fd3dd; --lit: #8bd48f; --data: #d79bf0; --turnstile: #d79bf0; }
  }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 system-ui, sans-serif; }
  header { padding: 6px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 16px; align-items: baseline; }
  header .dim, #status { color: var(--dim); font-size: 13px; }
  main { display: grid; grid-template-columns: 1fr 1fr; height: calc(100vh - 38px); }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; height: auto; } }
  #editor { box-sizing: border-box; width: 100%; height: 100%; min-height: 40vh; border: 0; border-right: 1px solid var(--line);
            padding: 12px 16px; background: var(--bg); color: var(--fg); font: 14px/1.5 ui-monospace, monospace; resize: none; }
  #side { overflow: auto; padding: 8px 16px; }
  #goals { font: 14px/1.5 ui-monospace, monospace; outline: none; }
  #goals h3 { font: 600 12px system-ui, sans-serif; text-transform: uppercase; letter-spacing: .05em; color: var(--dim); margin: 12px 0 4px; }
  .goal { border-left: 3px solid var(--line); padding: 2px 0 2px 10px; margin-bottom: 10px; white-space: pre-wrap; }
  .case { font-weight: 600; } .names { font-weight: 600; }
  .turnstile { color: var(--turnstile); font-weight: 600; }
  .no-goals { color: var(--lit); font-weight: 600; } .nothing { color: var(--dim); }
  .item-title { color: var(--dim); } .item-text { margin: 0.1em 0 0.4em 1.5em; white-space: pre-wrap; }
  .tt { cursor: pointer; border-radius: 2px; }
  .tt.hover { background: var(--hover); } .tt.sel { background: var(--sel); }
  .k-const { color: var(--const); } .k-var { color: var(--var); } .k-sort { color: var(--sort); }
  .k-lit { color: var(--lit); } .k-data { color: var(--data); }
  #info { margin-top: 12px; padding-top: 8px; border-top: 1px solid var(--line); font-size: 14px; min-height: 2em; }
  #info .kind { color: var(--dim); font-size: 12px; } #info .def { color: var(--dim); font-size: 13px; }
</style>
</head>
<body>
<header><strong>Wiz infoview</strong><span class="dim" id="pos">1:1</span><span id="status"></span></header>
<main>
<textarea id="editor" spellcheck="false">import Prelude
def k : (A : Type) → A → Nat → A := by
  intro A
  intro x
  intro n
  exact x
def two : Nat := Nat.add 1 _
</textarea>
<section id="side"><div id="goals" tabindex="0"></div><div id="info"></div></section>
</main>
<script type="module" src="infoview.js"></script>
</body>
</html>
