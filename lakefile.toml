name = "wiz"
version = "0.1.0"
defaultTargets = ["wiz", "grail", "tower"]
testDriver = "tests"
# compiled modules go to the shared Lake cache (keyed by their inputs), so worktrees
# reuse each other's builds
enableArtifactCache = true

[[lean_lib]]
name = "Wiz"

[[lean_lib]]
name = "Tests"

# The spec of the core theory and its reference checker (see
# WizMeta.lean). Not a default target: only the test driver imports it, so `lake build`
# and `wiz` don't build it.
[[lean_lib]]
name = "WizMeta"
# a misspelt name in a rule must be an error, not a fresh variable
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false }

[[lean_exe]]
name = "wiz"
moreLinkObjs = ["sockets"]
root = "Main"

[[lean_exe]]
name = "tests"
moreLinkObjs = ["sockets", "proc"]
root = "Tests.Main"

[[lean_lib]]
name = "Grail"

[[lean_exe]]
name = "grail"
moreLinkObjs = ["sockets", "proc"]
root = "Grail.Main"

# the toolchain manager (stage 26): it doesn't import Wiz
[[lean_lib]]
name = "Tower"

[[lean_exe]]
name = "tower"
root = "Tower.Main"

# Unix-domain sockets for `wiz lsp --infoview` (Lean's library has none): a C file
# that the linker compiles into each executable
[[input_file]]
name = "sockets"
path = "c/sockets.c"

# `_exit` for grail's job supervisor (Grail/Exec.lean), linked into grail and the tests
[[input_file]]
name = "proc"
path = "c/proc.c"

# The C runtime as text (`include_str`, runtime/WizRuntime.lean), a library of its own so
# that only it depends on runtime/wiz.c: `needs` mixes the file's hash into its modules'
# traces, so editing wiz.c rebuilds it and its importers (Lake doesn't track include_str)
[[lean_lib]]
name = "WizRuntime"
srcDir = "runtime"
needs = ["wizRuntimeC"]

[[input_file]]
name = "wizRuntimeC"
path = "runtime/wiz.c"
text = true
