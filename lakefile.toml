name = "wiz"
version = "0.1.0"
defaultTargets = ["wiz", "grail"]
testDriver = "tests"
# compiled modules go to the shared Lake cache (keyed by their inputs), so worktrees
# reuse each other's builds
enableArtifactCache = true

[[lean_lib]]
name = "Wiz"

[[lean_lib]]
name = "Tests"

[[lean_exe]]
name = "wiz"
root = "Main"

[[lean_exe]]
name = "tests"
root = "Tests.Main"

[[lean_lib]]
name = "Grail"

[[lean_exe]]
name = "grail"
root = "Grail.Main"
