name: Wiz toolchain
description: >
  Nix with the flake's dev shell (GMP, Boehm GC, LLVM, cc, elan), the Cachix binary cache
  if one is configured, and the elan toolchain from lean-toolchain (cached). Later steps
  run in the dev shell through `shell: nix develop --command bash -eo pipefail {0}`.
inputs:
  cachix-name:
    description: The Cachix cache to pull from (and push to, given a token); empty for none.
    default: ""
  cachix-token:
    description: The Cachix auth token; empty means pull only (e.g. pull requests from forks).
    default: ""
runs:
  using: composite
  steps:
    # a self-hosted runner brings its own Nix (docs/ci-runner.md)
    - if: runner.environment == 'github-hosted'
      uses: cachix/install-nix-action@v31
    - if: inputs.cachix-name != ''
      uses: cachix/cachix-action@v16
      with:
        name: ${{ inputs.cachix-name }}
        authToken: ${{ inputs.cachix-token }}
        skipPush: ${{ inputs.cachix-token == '' }}
    - name: Dev shell
      shell: bash
      run: nix develop --command bash -c 'cat grail.local.wiz; cc --version | head -1; elan --version'
    # Restored everywhere, saved only by master (a 770 MB entry per pull request would
    # crowd the repository's 10 GB Actions cache; pull requests read master's entry).
    - name: Restore the Lean toolchain
      id: elan-cache
      uses: actions/cache/restore@v4
      with:
        path: ~/.elan
        key: elan-${{ runner.os }}${{ runner.arch != 'X64' && format('-{0}', runner.arch) || '' }}-${{ hashFiles('lean-toolchain') }}
    - name: Lean toolchain
      shell: bash
      run: nix develop --command bash -c 'lake --version'
    - name: Save the Lean toolchain (master)
      if: steps.elan-cache.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/master'
      uses: actions/cache/save@v4
      with:
        path: ~/.elan
        key: elan-${{ runner.os }}${{ runner.arch != 'X64' && format('-{0}', runner.arch) || '' }}-${{ hashFiles('lean-toolchain') }}
