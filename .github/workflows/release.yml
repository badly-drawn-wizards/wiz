# Release tarballs (stages 26d, 26g): what `tower` installs with `--source release`, and
# what you can untar by hand (scripts/release-tarball.sh describes the layout).
#
# * a tag vX.Y.Z: a GitHub release of that tag with wiz-x86_64-linux.tar.gz (+ .sha256),
#   once the exercise tree builds (the `exercises` job; nothing is published if it fails);
# * a push to master: the pre-release `snapshot-<sha>` of that commit, then old snapshots
#   are pruned (scripts/release-snapshots.sh); the tag `nightly` moves to it only once CI
#   has passed on that commit (nightly.yml);
# * workflow_dispatch with `commit`: builds that (older) master commit and publishes its
#   snapshot (to satisfy a pin whose snapshot was pruned);
# * a pull request that touches the packaging: builds and tests the tarball, uploads nothing.
#
# The build is outside Nix, with elan's Lean, whose bundled clang and sysroot make the
# binaries depend only on glibc (>= 2.27) and the C runtime libraries, as Lean's own
# releases do: no /nix/store paths. The tarball also carries its own C toolchain
# (share/wiz/cc, scripts/bundle-cc.sh, stage 26f): Lean's clang and lld, a glibc 2.27
# sysroot, static GMP and Boehm GC, so `wiz build` and grail need nothing installed.
# (A dispatched commit older than 26f gets no bundle and is tested with gcc, as before.)
name: release

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
    paths:
      - scripts/release-tarball.sh
      - scripts/bundle-cc.sh
      - web/**
      - scripts/bundle-cc.sources
      - scripts/release-licenses/**
      - .github/workflows/release.yml
      - Tower/**
      - tower/**
      - scripts/build-tower-wiz.sh
      - scripts/release-snapshots.sh
      - scripts/test-release-snapshots.sh
      - .github/workflows/nightly.yml
      - lakefile.lean
  workflow_dispatch:
    inputs:
      commit:
        description: "a master commit (full sha) to build and publish as snapshot-<sha>; empty: just build"
        required: false
        default: ""

concurrency:
  # a newer master push cancels an older one (which then never moves nightly back);
  # a dispatched snapshot runs alongside
  group: release-${{ github.ref }}-${{ inputs.commit }}
  cancel-in-progress: true

permissions:
  contents: write # creating releases and uploading assets

jobs:
  # The exercise tree, generated from this one (docs/exercises.md): it must build, checked
  # only for a release tag (between releases it may bitrot). The tarball job waits for it,
  # so a tag whose exercise tree doesn't build publishes nothing. Its Lake cache is saved
  # by tag runs only (a few per year), so it doesn't crowd the main builds out of the
  # repository's 10 GB Actions cache.
  exercises:
    name: exercise tree
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: nix develop --command bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          cachix-name: badlydrawnwizards
      - name: Generate the exercise tree
        run: python3 scripts/mkexercises.py . "$RUNNER_TEMP/exercises"
      - name: Cache its Lake build
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/exercises/.lake
          key: exercises-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ hashFiles('lakefile.*', '**/*.lean') }}
          restore-keys: exercises-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - name: lake build (exercise tree)
        env:
          LAKE_CACHE_DIR: ${{ runner.temp }}/exercises/.lake/cache
        run: |
          # (the dev shell comes from this checkout's flake; the build runs in the copy)
          cd "$RUNNER_TEMP/exercises"
          lake build wiz grail tests

  tarball:
    name: release tarball (x86_64-linux)
    # after the exercise tree for a tag; without one (master, PRs, dispatch) it is skipped
    needs: exercises
    if: ${{ !cancelled() && (needs.exercises.result == 'success' || needs.exercises.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      LAKE_CACHE_DIR: ${{ github.workspace }}/.lake/cache
      # the commit built: the pushed one, or the dispatched `commit`
      OLD_COMMIT: ${{ inputs.commit }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.commit || github.sha }}
      # this workflow's own scripts (a dispatched old commit may predate them)
      - uses: actions/checkout@v5
        with:
          path: .release-tools
          sparse-checkout: scripts
      - name: The snapshot scripts work (a fake gh, nothing published)
        run: sh .release-tools/scripts/test-release-snapshots.sh
      - name: A dispatched commit is on master
        if: inputs.commit != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$OLD_COMMIT" in *[!0-9a-f]*) echo "commit: not a sha"; exit 1 ;; esac
          [ "$(git rev-parse HEAD)" = "$OLD_COMMIT" ] || { echo "commit: give the full 40-hex sha"; exit 1; }
          st=$(gh api "repos/${{ github.repository }}/compare/$OLD_COMMIT...master" --jq .status)
          case $st in ahead|identical) ;; *) echo "$OLD_COMMIT is not on master ($st)"; exit 1 ;; esac
      - name: elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Cache the Lake build
        uses: actions/cache@v4
        with:
          path: .lake
          key: release-lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ hashFiles('lakefile.lean', '**/*.lean', 'runtime/**', 'c/**') }}
          restore-keys: release-lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - name: lake build wiz grail
        # Lean's clang has a sysroot with libraries but no libc headers, and the link
        # step that compiles c/sockets.c (linked into wiz and grail) doesn't pass Lean's
        # own include/clang: give it both (it uses nothing newer than the sysroot's glibc)
        run: |
          export C_INCLUDE_PATH="$(lean --print-prefix)/include/clang:/usr/include/x86_64-linux-gnu:/usr/include"
          lake build wiz grail
      - name: The binaries don't depend on the build machine
        run: |
          for b in wiz grail; do
            ldd .lake/build/bin/$b
            if ldd .lake/build/bin/$b | grep -q /nix/store; then echo "$b links /nix/store paths"; exit 1; fi
          done
      # 11w: the web infoview (Web.wiz → C → Wasm with Emscripten), which `wiz lsp` serves
      # for wiz.nvim's :WizInfoviewBrowser. (A dispatched old commit may not have it.)
      - name: Build the web infoview?
        id: web
        run: |
          if grep -q -- --gmp-src web/build.sh 2>/dev/null; then echo "web=yes" >> "$GITHUB_OUTPUT"; else echo "web=no" >> "$GITHUB_OUTPUT"; fi
      - name: Emscripten
        if: steps.web.outputs.web == 'yes'
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.9
          actions-cache-folder: emsdk-cache
      - name: The web infoview (Wasm)
        if: steps.web.outputs.web == 'yes'
        run: |
          start=$(date +%s)
          # GMP's source, for mini-gmp: the mirrors scripts/bundle-cc.sources lists for it
          line=$(grep '^gmp-6.3.0.tar.xz ' .release-tools/scripts/bundle-cc.sources)
          sum=$(echo "$line" | cut -d' ' -f2)
          for u in $(echo "$line" | cut -d' ' -f3-); do
            curl -sSfL --retry 2 -o gmp-6.3.0.tar.xz "$u" && echo "$sum  gmp-6.3.0.tar.xz" | sha256sum -c && break
            rm -f gmp-6.3.0.tar.xz
          done
          [ -f gmp-6.3.0.tar.xz ] || { echo "no mirror had GMP's source"; exit 1; }
          sh web/build.sh web-out --gmp-src gmp-6.3.0.tar.xz
          ls -l web-out
          echo "web infoview built in $(( $(date +%s) - start )) s"
      # 26f: does the built commit use share/wiz/cc? (a dispatched old one may not)
      - name: Bundle a C toolchain?
        id: bundle
        run: |
          if grep -q withBundled Wiz/Toolchain.lean; then echo "cc=yes" >> "$GITHUB_OUTPUT"; else echo "cc=no" >> "$GITHUB_OUTPUT"; fi
      # the bundle's downloads (scripts/bundle-cc.sources), so a rebuild of the bundle
      # needs no outside server; master also copies them to the release bundle-inputs
      - name: Cache the bundle's downloads
        if: steps.bundle.outputs.cc == 'yes'
        uses: actions/cache@v4
        with:
          path: bundle-downloads
          key: bundle-inputs-${{ hashFiles('.release-tools/scripts/bundle-cc.sources') }}
      - name: Cache the bundled C toolchain
        if: steps.bundle.outputs.cc == 'yes'
        uses: actions/cache@v4
        with:
          path: cc-bundle
          key: release-cc-${{ runner.os }}-${{ hashFiles('lean-toolchain', '.release-tools/scripts/bundle-cc.sh', '.release-tools/scripts/bundle-cc.sources') }}
      - name: The bundled C toolchain (clang, glibc 2.27 sysroot, static GMP and GC)
        if: steps.bundle.outputs.cc == 'yes'
        run: |
          if [ ! -x cc-bundle/bin/cc ]; then
            sudo apt-get install -y -q m4 >/dev/null # GMP's configure
            sh .release-tools/scripts/bundle-cc.sh cc-bundle bundle-downloads
          fi
          du -sh cc-bundle
          # what the compiler itself needs (Lean's libLLVM/libclang-cpp: glibc 2.30)
          for f in cc-bundle/bin/clang cc-bundle/bin/ld.lld cc-bundle/lib/*.so*; do
            [ -L "$f" ] || echo "$(objdump -T "$f" | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1) $f"
          done
      - name: Build tower (Wiz, stage 26h)
        run: |
          set -eu
          if [ ! -d tower ] || [ ! -f scripts/build-tower-wiz.sh ]; then
            # A dispatched commit before 26e: build its own (Lean) tower.
            lake build tower
            exit 0
          fi
          # The bundled C toolchain links GMP statically and targets the tarball's glibc
          # 2.27; without a bundle (an older commit), the system cc and GMP do.
          if [ -x cc-bundle/bin/cc ]; then
            scripts/build-tower-wiz.sh .lake/build/bin/tower .lake/build/bin/grail \
              --cc "$PWD/cc-bundle/bin/cc"
          else
            scripts/build-tower-wiz.sh .lake/build/bin/tower .lake/build/bin/grail
          fi
          ldd .lake/build/bin/tower
          if ldd .lake/build/bin/tower | grep -q /nix/store; then echo "tower links /nix/store paths"; exit 1; fi
          .lake/build/bin/tower --version
      - name: Tarball
        env:
          BUNDLE_CC: ${{ steps.bundle.outputs.cc }}
          BUNDLE_WEB: ${{ steps.web.outputs.web }}
        run: |
          mkdir -p dist
          cc=; [ "$BUNDLE_CC" = yes ] && cc="cc-bundle"
          web=; [ "$BUNDLE_WEB" = yes ] && web="web-out"
          [ -z "$cc" ] && [ -n "$web" ] && { echo "a web dir needs the cc argument before it"; exit 1; }
          .release-tools/scripts/release-tarball.sh dist/wiz-x86_64-linux.tar.gz .lake/build/bin "$(git rev-parse HEAD)" $cc $web
          ls -l dist
      - name: The tarball builds programs with no C compiler or GMP installed (plain Ubuntu containers)
        # the acceptance test of 26f: the images have no gcc, cc, clang, libgmp or libc
        # headers. 20.04 (glibc 2.31) and 24.04 build and run; 18.04 (glibc 2.27, the
        # oldest the toolchain's binaries and the programs it builds support) checks and
        # runs the programs built on 20.04 (the bundled clang itself needs glibc 2.30)
        if: steps.bundle.outputs.cc == 'yes'
        run: |
          t=$(mktemp -d)
          tar -xzf dist/wiz-x86_64-linux.tar.gz -C "$t"
          d=$(mktemp -d); cp examples/io.wiz examples/import_c.wiz "$d/"
          mkdir -p "$d/pkg"; cp examples/io.wiz "$d/pkg/Main.wiz"
          printf 'import Grail\ndef package : Package := Package.new "hello"\n  |> Package.exe "hello" "Main.wiz"\n' > "$d/pkg/grail.wiz"
          cat > "$d/smoke.sh" <<'EOF'
          set -eux
          export PATH=/t/wiz-x86_64-linux/bin:$PATH HOME=/tmp/home
          mkdir -p $HOME; cp -R /w /tmp/w; cd /tmp/w
          for c in cc gcc clang; do if command -v $c; then echo "$c is installed"; exit 1; fi; done
          for h in /usr/include/stdio.h /usr/include/gmp.h /usr/include/x86_64-linux-gnu/gmp.h; do
            if [ -e $h ]; then echo "$h is installed"; exit 1; fi
          done
          wiz check io.wiz
          if [ "$1" = old ]; then
            # programs built on a newer system run here
            for p in io io-llvm hello; do /o/$p > out; head -1 out; done
            exit 0
          fi
          wiz build io.wiz -o io
          ./io > out; head -3 out
          wiz run io.wiz > out; head -1 out
          wiz build io.wiz -o io-llvm --llvm
          ./io-llvm > out; head -1 out
          wiz run import_c.wiz
          cd pkg; grail build; .grail/bin/hello > out; head -1 out
          cp .grail/bin/hello ../io ../io-llvm /o/
          EOF
          for img in ubuntu:24.04 ubuntu:20.04; do
            echo "::group::$img"
            o=$(mktemp -d)
            docker run --rm -v "$t:/t:ro" -v "$d:/w:ro" -v "$o:/o" "$img" sh /w/smoke.sh new
            echo "::endgroup::"
          done
          echo "::group::ubuntu:18.04"
          docker run --rm -v "$t:/t:ro" -v "$d:/w:ro" -v "$o:/o:ro" ubuntu:18.04 sh /w/smoke.sh old
          echo "::endgroup::"
      - name: The tarball works on a plain Ubuntu (with gcc and GMP for an old commit), and tower installs it
        run: |
          [ "${{ steps.bundle.outputs.cc }}" = yes ] || sudo apt-get install -y -q gcc libgmp-dev >/dev/null
          t=$(mktemp -d)
          tar -xzf dist/wiz-x86_64-linux.tar.gz -C "$t"
          d=$(mktemp -d); cp examples/io.wiz "$d/"; cd "$d"
          "$t/wiz-x86_64-linux/bin/wiz" check io.wiz
          "$t/wiz-x86_64-linux/bin/wiz" build io.wiz -o io
          ./io | head -3
          # an old commit's own tower may not know snapshots; the rest was checked
          [ -z "$OLD_COMMIT" ] || exit 0
          # tower: install this tarball as nightly from a local release directory laid out
          # as GitHub's (snapshot-<sha>/), nightly being HEAD of the checkout
          sha=$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)
          rel=$(mktemp -d); mkdir -p "$rel/snapshot-$sha"
          cp "$GITHUB_WORKSPACE"/dist/* "$rel/snapshot-$sha/"
          tower="$t/wiz-x86_64-linux/bin/tower --home $d/.tower"
          $tower set git "$GITHUB_WORKSPACE"
          $tower set nightly-ref HEAD
          $tower set releases "$rel"
          $tower set source release
          $tower self install
          $tower default nightly
          echo "$d/.tower/bin" >> "$GITHUB_PATH"
          PATH="$d/.tower/bin:$PATH" wiz check io.wiz
          PATH="$d/.tower/bin:$PATH" wiz build io.wiz -o io && ./io | head -1
          PATH="$d/.tower/bin:$PATH" tower toolchain list
      # docs/release.md: tower-init.sh installs this tarball as the toolchain of a tag (a
      # simulated one in a scratch directory for master; the tag itself for a tag push), and
      # the toolchain's URLs, contents and commands are checked; a tag publishes nothing if
      # it fails. Not for PRs (their branch may predate the repository's URLs) or a
      # dispatched old commit (its tarball predates the checks).
      - name: Install smoke test (tower-init.sh, a tag, the wiz-pl URLs)
        if: steps.bundle.outputs.cc == 'yes' && github.event_name == 'push' && inputs.commit == ''
        run: |
          tag=v0.0.0
          case "$GITHUB_REF" in refs/tags/v*) tag=$GITHUB_REF_NAME ;; esac
          sh .release-tools/scripts/test-release-install.sh dist/wiz-x86_64-linux.tar.gz "$tag" "${{ github.repository }}"
      - name: Mirror the bundle's downloads (the release bundle-inputs, the last mirror bundle-cc.sh tries)
        if: steps.bundle.outputs.cc == 'yes' && github.event_name == 'push' && github.ref == 'refs/heads/master'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          r="-R ${{ github.repository }}"
          gh release view bundle-inputs $r >/dev/null 2>&1 ||
            gh release create bundle-inputs $r --prerelease --target "$GITHUB_SHA" --title "Inputs of the bundled C toolchain" \
              --notes "Copies of the files scripts/bundle-cc.sources lists (sha256-checked there), the last mirror scripts/bundle-cc.sh tries. Not a Wiz release."
          have=$(gh release view bundle-inputs $r --json assets --jq '.assets[].name')
          for f in bundle-downloads/*; do
            case $f in *.part) continue ;; esac
            [ -f "$f" ] || continue
            echo "$have" | grep -qxF "$(basename "$f")" || gh release upload bundle-inputs $r "$f"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: wiz-x86_64-linux
          path: dist/
          # tags and snapshots are also release assets (which cost no Actions storage);
          # the artifact is a convenience: 90 days for a tag, 7 for a snapshot, 3 for a PR
          retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 90 || (github.event_name == 'pull_request' && 3 || 7) }}
      - name: Publish (a tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        # the notes are the tag's section of CHANGELOG.md (`## [X.Y.Z] - date`), which must
        # exist. A tag's assets are never replaced (docs/stability.md): if the release
        # exists already (a re-run), this fails; delete a half-made draft by hand first
        run: |
          v=${GITHUB_REF_NAME#v}
          notes=$RUNNER_TEMP/notes.md
          awk -v h="## [$v]" 'index($0, h) == 1 { on = 1; next } on && /^## \[/ { exit } on' CHANGELOG.md > "$notes"
          if ! grep -q '[^[:space:]]' "$notes"; then echo "CHANGELOG.md has no section [$v]"; exit 1; fi
          printf '\nInstall: `curl -sSfL https://raw.githubusercontent.com/%s/%s/scripts/tower-init.sh | sh -s -- %s` (docs/install.md).\n' \
            "${{ github.repository }}" "$GITHUB_REF_NAME" "$GITHUB_REF_NAME" >> "$notes"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "release ${GITHUB_REF_NAME} exists already: its assets are not replaced"; exit 1
          fi
          gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --title "Wiz ${GITHUB_REF_NAME}" --notes-file "$notes"
      # snapshot-<sha>, then pruning (26g); nightly.yml moves nightly once CI passed
      - name: Publish (snapshot, from master)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: .release-tools/scripts/release-snapshots.sh publish "$GITHUB_SHA" dist
      - name: Publish (snapshot of a dispatched commit)
        if: inputs.commit != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: .release-tools/scripts/release-snapshots.sh publish "$OLD_COMMIT" dist
