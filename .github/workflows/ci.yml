# Wiz CI. See "Continuous integration" in docs/building.md.
#
# Runs on `master` (the integration branch, with the solutions in it) and on pull
# requests into it: the full suite, split into shards (.github/test-shards.json). The
# exercise tree is not a branch: the `exercises` job generates it with
# scripts/mkexercises.py and checks that it builds.
name: CI

on:
  push:
    branches: [master]  # agent branches are tested through their PRs
  pull_request:
    branches: [master]
  # the merge queue (docs/building.md, "Merging"): each queued PR is tested merged onto
  # master and the PRs ahead of it, and lands only if this run's `CI result` passes
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "23 2 * * 1" # Mondays: the bootstrap fixpoint check
  workflow_dispatch:
    inputs:
      fixpoint:
        description: Also run the bootstrap fixpoint check (slow)
        type: boolean
        default: false

# A newer push to a pull request supersedes its running check (saves minutes). Runs on
# the branches themselves (push events) are never cancelled: pull requests are merged
# on green without being up to date, so the run of each merge commit is what tells
# which merge broke something. They get a group per commit, since a shared group with
# cancel-in-progress off would still drop a queued run when a newer one arrives. A merge
# queue entry has a ref of its own (gh-readonly-queue/master/pr-N-SHA) and is never
# cancelled by this rule (the queue cancels it when the entry leaves the queue).
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'schedule' && 'fixpoint' || 'checks' }}${{ github.event_name == 'push' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.event_name != 'push' && github.event_name != 'merge_group' }}

permissions:
  contents: read

env:
  # The Cachix binary cache (empty: none, everything comes from cache.nixos.org). Pushing
  # to it needs the repository secret CACHIX_AUTH_TOKEN; without the secret (pull
  # requests from forks) it is pull-only.
  CACHIX_NAME: badlydrawnwizards
  # Lake's artifact cache (enableArtifactCache in lakefile.toml) inside .lake rather than
  # under the elan toolchain, so that caching .lake caches the whole build.
  LAKE_CACHE_DIR: ${{ github.workspace }}/.lake/cache

defaults:
  run:
    shell: nix develop --command bash -eo pipefail {0}

jobs:
  # Path filters: which jobs a pull request needs (scripts/ci.py changes; the shards'
  # "inputs" in .github/test-shards.json). A docs-only PR builds and tests nothing; a PR
  # touching only lib/ files no core test reads skips the core shard; the selfhost
  # shards run for selfhost/ and the lib/ files it imports. Everything but a
  # pull_request (pushes, the merge queue, manual runs) runs every job.
  changes:
    name: changes
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      shards: ${{ steps.filter.outputs.shards }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2 # a pull request's merge commit and its first parent (the base)
      - name: What changed
        id: filter
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            git diff --name-only HEAD^1 HEAD | sed 's/^/  /'
            python3 scripts/ci.py changes HEAD^1 HEAD >> "$GITHUB_OUTPUT"
          else
            python3 scripts/ci.py changes --all >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  build:
    name: build
    needs: changes
    if: github.event_name != 'schedule' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      tree: solution # only the summary's title reads it (there is one tree now)
      matrix: ${{ steps.shards.outputs.matrix }}
      lake-key: ${{ steps.key.outputs.key }}
      lake-hash: ${{ steps.key.outputs.hash }}
      compiler-key: ${{ steps.key.outputs.compiler }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          cachix-name: ${{ env.CACHIX_NAME }}
          # empty in pull requests from forks: Cachix is then pull-only
          cachix-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Cache key
        id: key
        shell: bash
        run: |
          # the hash part alone too: a test job on another architecture (a self-hosted
          # runner, docs/ci-runner.md) prefixes its own os/arch
          echo "hash=${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ hashFiles('lakefile.toml', '**/*.lean') }}" >> "$GITHUB_OUTPUT"
          echo "key=lake-${{ runner.os }}${{ runner.arch != 'X64' && format('-{0}', runner.arch) || '' }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ hashFiles('lakefile.toml', '**/*.lean') }}" >> "$GITHUB_OUTPUT"
          # what identifies the compiler and test driver (and the C toolchain they use)
          echo "compiler=${{ hashFiles('flake.lock', 'flake.nix', 'lean-toolchain', 'lake-manifest.json', 'lakefile.toml', '**/*.lean', 'runtime/**', 'c/**') }}" >> "$GITHUB_OUTPUT"
      - name: Cache the Lake build
        uses: actions/cache@v4
        with:
          path: .lake
          key: ${{ steps.key.outputs.key }}
          restore-keys: lake-${{ runner.os }}${{ runner.arch != 'X64' && format('-{0}', runner.arch) || '' }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - name: lake build
        run: |
          # The artifact cache only grows (each commit adds the modules it changed); start
          # afresh when it gets big.
          if [ -d .lake/cache ] && [ "$(du -sm .lake/cache | cut -f1)" -gt 3000 ]; then
            echo "Lake's artifact cache is over 3 GB: building from scratch"; rm -rf .lake
          fi
          lake build wiz grail tests
          du -sh .lake .lake/cache 2>/dev/null || true
      - name: Every test case is in exactly one shard
        run: python3 scripts/ci.py check-shards
      - name: Shards
        id: shards
        run: |
          # a shard with "split" becomes several, balanced by .github/test-timings.json
          # only the shards this change needs (all of them outside pull requests)
          echo "matrix=$(python3 scripts/ci.py matrix --only '${{ needs.changes.outputs.shards }}')" >> "$GITHUB_OUTPUT"
          python3 scripts/ci.py plan
      - name: Lake tracks the embedded runtime (runtime/wiz.c)
        # editing wiz.c rebuilds what embeds it and nothing else (docs/building.md)
        run: scripts/test-embed.sh

  test:
    name: test (${{ matrix.shard.name }})
    needs: [changes, build]
    if: needs.changes.outputs.shards != '[]'
    # A "heavy" shard (.github/test-shards.json) runs on the self-hosted runner whose
    # label is the repository variable WIZ_RUNNER_HEAVY (docs/ci-runner.md), when that is
    # set and the code is this repository's: a pull request from a fork never runs there
    # (it would run untrusted code on that machine) and uses GitHub's runner instead.
    # Unset (the default): every shard on ubuntu-latest, as before.
    runs-on: ${{ matrix.shard.heavy && vars.WIZ_RUNNER_HEAVY != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.WIZ_RUNNER_HEAVY || 'ubuntu-latest' }}
    timeout-minutes: 90 # the selfhost group is split into parts (test-shards.json) to keep each one short
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          cachix-name: ${{ env.CACHIX_NAME }}
          cachix-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # The build job's .lake (same os/arch); on another architecture the same sources'
      # build for it, if a run there saved one (else `lake test` builds from scratch)
      - name: Restore the Lake build
        id: lake-cache
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lake-${{ runner.os }}${{ runner.arch != 'X64' && format('-{0}', runner.arch) || '' }}-${{ needs.build.outputs.lake-hash }}
          # the exact entry can be gone already: the build job saved it minutes ago, but
          # the repository's 10 GB cache evicts the least recently used entries, and
          # with many PRs a 740 MB Lake cache lasts only minutes (#103, #134: the late
          # shards of a run found nothing and ran without wiz and grail). Then the
          # newest older build of the same toolchain, and the next step catches up.
          restore-keys: lake-${{ runner.os }}${{ runner.arch != 'X64' && format('-{0}', runner.arch) || '' }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      # `lake test` builds only the test driver: build the executables the tests run too
      # (a no-op after an exact hit), and stop if they're missing rather than run without
      - name: lake build (unless restored)
        run: |
          if [ "${{ steps.lake-cache.outputs.cache-hit }}" != true ]; then
            echo "::warning title=Lake cache::no exact Lake build for this commit (evicted?): building wiz, grail and tests here"
          fi
          lake build wiz grail tests
          for b in wiz grail tests; do
            [ -x ".lake/build/bin/$b" ] || { echo "::error::.lake/build/bin/$b is missing after lake build"; exit 1; }
          done
      # What the suite builds from Wiz programs, kept between runs: the elaboration cache
      # (`--cache`, which the grail-selfhost test uses), grail's `.grail` (the test's
      # build of the self-hosted checker) and the self-hosted checker and compiler that
      # Tests/Elab.lean compiles under /tmp. The elaboration cache's keys include the wiz
      # binary's hash, but the test runner's grail key has a constant binary id and the
      # /tmp programs a timestamp, so the key starts with the compiler's inputs and
      # restore-keys never cross compilers; within one compiler, entries are
      # content-addressed, so a partial hit (other Wiz files) is safe.
      - name: Restore the Wiz build caches
        id: wiz-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/wiz
            .grail
            /tmp/wiz-selfhost-*
          key: wiz-${{ runner.os }}${{ runner.arch != 'X64' && format('-{0}', runner.arch) || '' }}-${{ matrix.shard.name }}-${{ needs.build.outputs.compiler-key }}-${{ hashFiles('**/*.wiz') }}
          restore-keys: wiz-${{ runner.os }}${{ runner.arch != 'X64' && format('-{0}', runner.arch) || '' }}-${{ matrix.shard.name }}-${{ needs.build.outputs.compiler-key }}-
      - name: lake test -- ${{ matrix.shard.name }}
        env:
          SELECT: ${{ matrix.shard.select }}
        run: |
          mapfile -t sel <<< "$SELECT"
          mkdir -p logs ~/.cache/wiz
          du -sh ~/.cache/wiz .grail /tmp/wiz-selfhost-* 2>/dev/null || true
          echo "lake test -- --cache ~/.cache/wiz ${sel[*]}"
          # every case's time, as JSON lines (scripts/ci.py summary and baseline read them)
          lake test -- --cache "$HOME/.cache/wiz" --timings "logs/${{ matrix.shard.name }}.jsonl" \
            --shard "${{ matrix.shard.name }}" "${sel[@]}" 2>&1 | tee "logs/${{ matrix.shard.name }}.log"
      # a test job on another architecture (no build job there) keeps its own build
      - name: Save the Lake build (${{ runner.arch }})
        if: always() && runner.arch != 'X64' && steps.lake-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .lake
          key: lake-${{ runner.os }}${{ runner.arch != 'X64' && format('-{0}', runner.arch) || '' }}-${{ needs.build.outputs.lake-hash }}
      - name: Save the Wiz build caches
        if: always() && steps.wiz-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/wiz
            .grail
            /tmp/wiz-selfhost-*
          key: wiz-${{ runner.os }}${{ runner.arch != 'X64' && format('-{0}', runner.arch) || '' }}-${{ matrix.shard.name }}-${{ needs.build.outputs.compiler-key }}-${{ hashFiles('**/*.wiz') }}
      - name: Summary
        if: always()
        run: |
          [ -f "logs/${{ matrix.shard.name }}.log" ] || exit 0
          shopt -s nullglob
          python3 scripts/ci.py summary "shard ${{ matrix.shard.name }}" logs/${{ matrix.shard.name }}.log logs/${{ matrix.shard.name }}.jsonl >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-log-${{ matrix.shard.name }}
          path: logs/
          if-no-files-found: ignore
          # always uploaded (the `CI result` job sums them up), but kept briefly
          retention-days: 3

  # The Nix package (flake.nix: wiz and grail, wrapped with the toolchain), pushed to
  # Cachix when the token is there (pushes, and pull requests from this repository), so
  # that `nix run github:badly-drawn-wizards/wiz` downloads it. It is a pure Nix build
  # without Lake's artifact cache, so it rebuilds every module when a .lean file changes;
  # the tests keep using Lake (incremental) and don't wait for it.
  package:
    name: nix package
    needs: changes
    if: github.event_name != 'schedule' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: ${{ env.CACHIX_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ secrets.CACHIX_AUTH_TOKEN == '' }}
      - name: nix build .#wiz
        shell: bash
        run: nix build .#wiz -L --print-out-paths
      - name: The package checks, builds and runs a program outside the checkout
        shell: bash
        run: |
          dir=$(mktemp -d)
          cp examples/io.wiz "$dir/"
          cd "$dir"
          nix run "$GITHUB_WORKSPACE#wiz" -- check io.wiz
          nix run "$GITHUB_WORKSPACE#wiz" -- build io.wiz -o io
          ./io | head -3
          nix run "$GITHUB_WORKSPACE#grail" -- 2>&1 | head -2

  # One check for branch protection, and the whole suite's summary.
  result:
    name: CI result
    needs: [changes, build, test, exercises, package]
    if: always() && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write # deleting this pull request's big cache entries (below)
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            scripts
            .github
      - uses: actions/download-artifact@v5
        if: needs.test.result != 'skipped' # no shard ran: nothing to sum up
        with:
          pattern: test-log-*
          path: logs
          merge-multiple: true
      - name: Summary
        if: needs.test.result != 'skipped' # no shard ran: nothing to sum up
        shell: bash
        run: |
          shopt -s nullglob
          logs=(logs/*.log logs/*.jsonl)
          python3 scripts/ci.py summary "Wiz test suite (${{ needs.build.outputs.tree }} tree)" "${logs[@]}" >> "$GITHUB_STEP_SUMMARY"
          # all shards' case times in one file, for `scripts/ci.py baseline`
          mkdir -p timings
          cat logs/*.jsonl > timings/timings.jsonl 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: needs.test.result != 'skipped' # no shard ran: nothing to sum up
        with:
          name: test-timings
          path: timings/timings.jsonl
          if-no-files-found: ignore
          # master's feed `scripts/ci.py baseline` (docs/building.md); others are short-lived
          retention-days: ${{ github.event_name == 'push' && 7 || 2 }}
      # The shards stay balanced (docs/building.md, "Shard balance"): warn, never fail, when
      # the longest shard is over 1.5x the median, a split shard's cases are missing from
      # the baseline, or two parts build the same program. On master, a run whose tests all
      # passed and that drifted uploads the regenerated baseline (`test-timings-baseline`).
      - name: Shard balance
        id: balance
        if: needs.test.result != 'skipped' # no shard ran: nothing to sum up
        continue-on-error: true
        shell: bash
        run: |
          shopt -s nullglob
          rm -f test-timings.json
          python3 scripts/ci.py balance --factor 1.5 --baseline-out test-timings.json logs/*.jsonl >> "$GITHUB_STEP_SUMMARY"
          if [ -f test-timings.json ] && [ "${{ github.event_name }}" = push ] && [ "${{ needs.test.result }}" = success ]; then
            echo "refresh=true" >> "$GITHUB_OUTPUT"
            cmd="gh run download ${{ github.run_id }} -R ${{ github.repository }} -n test-timings-baseline -D .github"
            echo "::warning title=Shard balance::the test-timings baseline drifted; to apply this run's: $cmd"
            { echo; echo "To apply it (then commit .github/test-timings.json in a PR):"; echo; echo '```'; echo "$cmd"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: steps.balance.outputs.refresh == 'true'
        with:
          name: test-timings-baseline
          path: test-timings.json
          retention-days: 7
      # A pull request's (or merge queue entry's) Lake build is saved only to hand it to
      # its test shards; once they're done it's dead weight that evicts master's entries
      # from the 10 GB Actions cache (each is ~500 MB). The next push restores master's
      # build and catches up. The small per-shard wiz-* entries stay. Not in a cancelled
      # run (the newer run of this ref may be using them). Fork PRs get a read-only token:
      # the step may fail, which is fine.
      - name: Drop this ref's Lake caches
        if: ${{ !cancelled() && github.event_name != 'push' && github.event_name != 'workflow_dispatch' }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list -R "${{ github.repository }}" --ref "${{ github.ref }}" --limit 100 --json id,key,sizeInBytes \
            --jq '.[] | select(.key | test("^(lake|exercises|elan)-")) | "\(.id) \(.sizeInBytes) \(.key)"' |
          while read -r id size key; do
            echo "deleting $key ($((size / 1000000)) MB)"
            gh cache delete -R "${{ github.repository }}" "$id" || true
          done
      - name: Verdict
        shell: bash
        run: |
          echo "changes: ${{ needs.changes.result }} (code: ${{ needs.changes.outputs.code }}, shards: ${{ needs.changes.outputs.shards }})"
          echo "build: ${{ needs.build.result }}, test: ${{ needs.test.result }}, exercises: ${{ needs.exercises.result }}, package: ${{ needs.package.result }}"
          # the path filter must have run; a job it skipped is not a failure, but outside
          # pull requests (and whenever the filter wants them) every job must succeed
          [ "${{ needs.changes.result }}" = success ] || exit 1
          code="${{ needs.changes.outputs.code }}"
          want_tests=$([ "${{ needs.changes.outputs.shards }}" != "[]" ] && echo true || echo false)
          check() { # NAME RESULT WANTED
            if [ "$3" = true ]; then [ "$2" = success ] || { echo "$1: $2 (needed)"; exit 1; }
            else [ "$2" = success ] || [ "$2" = skipped ] || { echo "$1: $2"; exit 1; }; fi
          }
          check build "${{ needs.build.result }}" "$code"
          check test "${{ needs.test.result }}" "$want_tests"
          check exercises "${{ needs.exercises.result }}" "$code"
          check package "${{ needs.package.result }}" "$code"

  # The exercise tree, generated from this one (docs/exercises.md): it must build. It runs
  # beside the test shards, with its own Lake cache (most modules differ from this tree's).
  exercises:
    name: exercise tree
    needs: changes
    if: github.event_name != 'schedule' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          cachix-name: ${{ env.CACHIX_NAME }}
          cachix-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Generate the exercise tree
        run: python3 scripts/mkexercises.py . "$RUNNER_TEMP/exercises"
      - name: Cache its Lake build
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/exercises/.lake
          key: exercises-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ hashFiles('lakefile.toml', '**/*.lean') }}
          restore-keys: exercises-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - name: lake build (exercise tree)
        env:
          LAKE_CACHE_DIR: ${{ runner.temp }}/exercises/.lake/cache
        run: |
          # (the dev shell comes from this checkout's flake; the build runs in the copy)
          cd "$RUNNER_TEMP/exercises"
          lake build wiz grail tests

  # Stage-1 C of the toolchain = stage-2 C (scripts/fixpoint.sh). Scheduled runs use the
  # default branch (master).
  fixpoint:
    name: bootstrap fixpoint
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.fixpoint)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          cachix-name: ${{ env.CACHIX_NAME }}
          cachix-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Cache the Lake build and the elaboration cache
        uses: actions/cache@v4
        with:
          path: |
            .lake
            ~/.cache/wiz
          key: fixpoint-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ hashFiles('lakefile.toml', '**/*.lean', 'selfhost/*.wiz', 'lib/*.wiz') }}
          restore-keys: fixpoint-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - name: Fixpoint
        run: scripts/fixpoint.sh .lake/fixpoint 2>&1 | tee fixpoint.log
      - name: Summary
        if: always()
        shell: bash
        run: |
          { echo "### Bootstrap fixpoint"; echo; echo '```'; grep -E 'FIXPOINT|^==' fixpoint.log || echo "(no result)"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
